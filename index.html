
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL Guy | $LOL</title>
    <link rel="icon" type="image/jpeg" href="https://pbs.twimg.com/profile_images/1968362464698839040/40F6gXh__400x400.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Caveat', cursive;
        background-color: #ffffff;
        color: #000000;
        overflow-x: hidden;
      }
      .marker-font {
        font-family: 'Permanent Marker', cursive;
      }
      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.3; }
        90% { opacity: 0.3; }
        100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(360deg); opacity: 0; }
      }
      .floating-lol {
        position: fixed;
        pointer-events: none;
        z-index: -1;
        animation: float var(--duration) linear infinite;
        font-weight: bold;
        color: rgba(0,0,0,0.1);
        user-select: none;
      }
      .sketch-border {
        border: 4px solid black;
        border-radius: 4px 12px 6px 15px / 12px 6px 15px 4px;
      }
      .sketch-divider {
        height: 8px;
        background: black;
        width: 100%;
        border-radius: 10px;
        margin: 4rem 0;
        transform: rotate(-0.5deg);
      }
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #fff;
        border-left: 2px solid #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #000;
        border: 2px solid #fff;
      }
      * {
        font-family: 'Caveat', cursive !important;
      }
      .marker-font, .marker-font * {
        font-family: 'Permanent Marker', cursive !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module">
      window.process = window.process || { env: {} };
      try {
        if (import.meta.env && import.meta.env.VITE_API_KEY) {
          window.process.env.API_KEY = import.meta.env.VITE_API_KEY;
        }
      } catch (e) {
        console.warn("API Key bridge error:", e);
      }
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
